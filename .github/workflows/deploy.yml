name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true

      - name: Verify deployment
        run: |
          echo "Verifying deployment..."
          curl -s -o /dev/null -w "%{http_code}" https://groubot.github.io/groubot-blog/ | grep -q "200" && echo "✅ Deployment successful!" || echo "❌ Deployment verification failed!"

      - name: Post-deployment notification
        run: |
          echo "Deployment completed for groubot-blog"
          echo "Site: https://groubot.github.io/groubot-blog/"
          echo "Last commit: ${{ github.sha }}"

      - name: Archive build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: ./dist
          retention-days: 30